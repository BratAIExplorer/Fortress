<!DOCTYPE html>
<html>
<head>
  <title>Fortress Code Architecture Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; overflow: hidden; background: #0a0e27; }
    #graph { width: 100vw; height: 100vh; }
    .node { cursor: pointer; }
    .node-label { font-size: 11px; pointer-events: none; }
    .node-text { font-size: 10px; fill: #fff; pointer-events: none; }
    .info-panel { position: absolute; top: 10px; right: 10px; width: 320px; background: rgba(255,255,255,0.95); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-height: 80vh; overflow-y: auto; }
    .info-title { font-size: 16px; font-weight: bold; margin-bottom: 12px; }
    .info-field { margin: 8px 0; font-size: 12px; }
    .info-label { font-weight: 600; color: #333; }
    .info-value { color: #666; word-break: break-all; }
    .stats-panel { position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.95); padding: 12px 16px; border-radius: 8px; font-size: 12px; }
    .controls { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.95); padding: 12px 16px; border-radius: 8px; }
    button { padding: 6px 12px; margin-right: 6px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <svg id="graph"></svg>
  <div class="controls">
    <button onclick="resetZoom()">Reset View</button>
    <button onclick="toggleLabels()">Toggle Labels</button>
  </div>
  <div class="info-panel" id="infoPanel" style="display: none;"></div>
  <div class="stats-panel">
    <div id="stats"></div>
  </div>

  <script>
    let data, simulation, showLabels = true;
    const width = window.innerWidth;
    const height = window.innerHeight;
    const svg = d3.select("#graph")
      .attr("width", width)
      .attr("height", height)
      .call(d3.zoom().on("zoom", (e) => g.attr("transform", e.transform)));

    const g = svg.append("g");

    // Load graph data
    fetch("graph.json")
      .then(r => r.json())
      .then(d => {
        data = d;
        initGraph();
      })
      .catch(e => {
        document.getElementById("stats").textContent = "Error loading graph.json: " + e.message;
      });

    function initGraph() {
      const stats = data.nodes ? {
        nodes: data.nodes.length,
        edges: (data.links || data.edges || []).length,
        communities: new Set(data.nodes.map(n => n.community)).size
      } : {};

      document.getElementById("stats").textContent =
        `Nodes: ${stats.nodes} | Edges: ${stats.edges} | Communities: ${stats.communities}`;

      const links = data.links || data.edges || [];
      const nodes = data.nodes || [];

      // Color by community
      const colorScale = d3.scaleOrdinal(d3.schemeCategory10)
        .domain(Array.from(new Set(nodes.map(n => n.community))));

      // Force simulation
      simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links)
          .id(d => d.id)
          .distance(d => d.value ? 50 : 30))
        .force("charge", d3.forceManyBody().strength(-300))
        .force("center", d3.forceCenter(width/2, height/2));

      // Draw links
      const link = g.selectAll("line")
        .data(links)
        .enter()
        .append("line")
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.6)
        .attr("stroke-width", 1);

      // Draw nodes
      const node = g.selectAll("circle")
        .data(nodes)
        .enter()
        .append("circle")
        .attr("r", d => Math.sqrt(d.metadata?.imports || 1) + 3)
        .attr("fill", d => colorScale(d.community))
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .attr("class", "node")
        .on("click", showNodeInfo)
        .call(d3.drag()
          .on("start", dragStart)
          .on("drag", drag)
          .on("end", dragEnd));

      // Draw labels
      const labels = g.selectAll("text")
        .data(nodes)
        .enter()
        .append("text")
        .attr("class", "node-text")
        .attr("text-anchor", "middle")
        .attr("dy", "0.3em")
        .text(d => d.label ? d.label.substring(0, 15) : d.id);

      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("cx", d => d.x = Math.max(10, Math.min(width-10, d.x)))
          .attr("cy", d => d.y = Math.max(10, Math.min(height-10, d.y)));

        labels
          .attr("x", d => d.x)
          .attr("y", d => d.y);
      });
    }

    function showNodeInfo(event, d) {
      const panel = document.getElementById("infoPanel");
      let html = `<div class="info-title">${d.label || d.id}</div>`;
      html += `<div class="info-field"><span class="info-label">Type:</span> <span class="info-value">${d.file_type || 'unknown'}</span></div>`;
      html += `<div class="info-field"><span class="info-label">File:</span> <span class="info-value">${d.source_file || 'N/A'}</span></div>`;
      html += `<div class="info-field"><span class="info-label">Location:</span> <span class="info-value">${d.source_location || 'N/A'}</span></div>`;
      html += `<div class="info-field"><span class="info-label">Community:</span> <span class="info-value">${d.community || 'N/A'}</span></div>`;
      html += `<div class="info-field"><span class="info-label">Kind:</span> <span class="info-value">${d.metadata?.kind || 'unknown'}</span></div>`;
      panel.innerHTML = html;
      panel.style.display = "block";
    }

    function dragStart(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function drag(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragEnd(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    function resetZoom() {
      svg.transition()
        .duration(750)
        .call(d3.zoom().transform, d3.zoomIdentity.translate(width/2, height/2));
    }

    function toggleLabels() {
      showLabels = !showLabels;
      g.selectAll("text").style("opacity", showLabels ? 1 : 0);
    }
  </script>
</body>
</html>
